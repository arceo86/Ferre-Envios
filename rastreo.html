<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Rastreo | Ferretería Granados</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --naranja: #ff9800;
      --rojo: #d32f2f;
      --verde: #2e7d32;
      --azul: #1565c0;
      --gris: #667085;
      --fondo: #f5f5f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      background: var(--fondo);
      color: #101828;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    #mapa {
      flex: 1;
      min-height: 52vh;
      width: 100%;
      background: #e5e7eb;
    }

    .boton-centrar {
      position: fixed;
      z-index: 20;
      top: 16px;
      right: 16px;
      min-height: 42px;
      padding: 10px 13px;
      border: 0;
      border-radius: 12px;
      background: rgba(255,255,255,.96);
      color: #1f2937;
      box-shadow: 0 5px 18px rgba(0,0,0,.16);
      font: 700 12px "Inter", sans-serif;
      cursor: pointer;
    }

    .panel-info {
      position: relative;
      z-index: 10;
      margin-top: -22px;
      padding: 22px 22px 26px;
      background: #ffffff;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -5px 18px rgba(0,0,0,.10);
    }

    .fila-estado {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .etiqueta-estado {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--naranja);
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .ultima-actualizacion {
      font-size: 11px;
      color: var(--gris);
      text-align: right;
    }

    .titulo {
      margin: 0 0 7px;
      font-size: 22px;
      line-height: 1.2;
    }

    .subtitulo {
      margin: 0;
      color: var(--gris);
      font-size: 14px;
      line-height: 1.45;
    }

    .resumen {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .dato {
      min-width: 0;
      padding: 12px;
      border: 1px solid #eaecf0;
      border-radius: 12px;
      background: #f9fafb;
    }

    .dato small {
      display: block;
      margin-bottom: 4px;
      color: var(--gris);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .dato strong {
      display: block;
      overflow: hidden;
      font-size: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detalles {
      display: grid;
      grid-template-columns: 62px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #eaecf0;
    }

    .icono-camion {
      width: 62px;
      height: 48px;
      object-fit: contain;
    }

    .repartidor {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
    }

    .detalle-secundario {
      margin: 4px 0 0;
      color: var(--gris);
      font-size: 13px;
    }

    .mensaje-error {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border: 1px solid #fecdca;
      border-radius: 12px;
      background: #fef3f2;
      color: #b42318;
      font-size: 13px;
      line-height: 1.45;
    }

    @media (min-width: 760px) {
      body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 380px;
        height: 100vh;
      }

      #mapa {
        height: 100vh;
      }

      .panel-info {
        margin-top: 0;
        overflow-y: auto;
        border-radius: 0;
        box-shadow: -5px 0 18px rgba(0,0,0,.10);
        padding-top: 34px;
      }

      .boton-centrar {
        right: 400px;
      }
    }
  </style>

  <script>
    window.mapaListo = false;

    window.initMap = function () {
      window.mapaListo = true;
      window.dispatchEvent(
        new Event("google-maps-ready")
      );
    };
  </script>

  <!-- Conserva aquí tu clave actual de Google Maps -->
  <script
    async
    defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAULZVgzMl8aubVLoqJyLs_ftyfb0E8D8o&language=es&region=MX&callback=initMap">
  </script>
</head>

<body>
  <div id="mapa"></div>

  <button id="btnCentrarMapa" class="boton-centrar" type="button">
    ⦿ Centrar recorrido
  </button>

  <section class="panel-info">
    <div class="fila-estado">
      <span id="estadoTexto" class="etiqueta-estado">
        CARGANDO
      </span>

      <span id="ultimaActualizacion" class="ultima-actualizacion">
        Sin datos
      </span>
    </div>

    <h1 id="tituloPrincipal" class="titulo">
      Consultando tu pedido...
    </h1>

    <p id="subtituloDestino" class="subtitulo">
      Ferretería Granados
    </p>

    <div class="resumen">
      <div class="dato">
        <small>Pedido</small>
        <strong id="pedidoIdTexto">—</strong>
      </div>

      <div class="dato">
        <small>Distancia estimada</small>
        <strong id="distanciaTexto">—</strong>
      </div>
    </div>

    <div class="detalles">
      <img
        class="icono-camion"
        src="https://lh3.googleusercontent.com/d/1BO70O8A3Qf0qPeoFoCqezV3G0sNZMkc4"
        alt="Camioneta de reparto"
      >

      <div>
        <p id="nombreRepartidor" class="repartidor">
          Repartidor asignado
        </p>

        <p id="detalleRepartidor" class="detalle-secundario">
          Esperando ubicación
        </p>
      </div>
    </div>

    <div id="mensajeError" class="mensaje-error"></div>
  </section>

  <script type="module" src="./rastreo.js?v=4"></script>
</body>
</html>
