<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rastreo | Ferretería Granados</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --naranja: #ff9800;
      --rojo: #d32f2f;
      --verde: #2e7d32;
      --azul: #1565c0;
      --gris: #667085;
      --fondo: #f5f5f5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      background: var(--fondo);
      color: #101828;
      display: flex;
      flex-direction: column;
    }

    #mapa {
      flex: 1;
      min-height: 52vh;
      width: 100%;
      background: #e5e7eb;
    }

    .panel-info {
      position: relative;
      z-index: 10;
      margin-top: -22px;
      padding: 22px 22px 26px;
      background: #fff;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -5px 18px rgba(0, 0, 0, 0.10);
    }

    .fila-estado {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .etiqueta-estado {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--naranja);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .ultima-actualizacion {
      font-size: 11px;
      color: var(--gris);
      text-align: right;
    }

    .titulo {
      margin: 0 0 7px;
      font-size: 22px;
      line-height: 1.2;
    }

    .subtitulo {
      margin: 0;
      color: var(--gris);
      font-size: 14px;
      line-height: 1.45;
    }

    .detalles {
      display: grid;
      grid-template-columns: 62px 1fr;
      gap: 14px;
      align-items: center;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #eaecf0;
    }

    .icono-camion {
      width: 62px;
      height: 48px;
      object-fit: contain;
    }

    .repartidor {
      margin: 0;
      font-weight: 800;
      font-size: 15px;
    }

    .detalle-secundario {
      margin: 4px 0 0;
      color: var(--gris);
      font-size: 13px;
    }

    .mensaje-error {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border-radius: 12px;
      background: #fef3f2;
      border: 1px solid #fecdca;
      color: #b42318;
      font-size: 13px;
      line-height: 1.45;
    }

    .resumen {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .dato {
      padding: 12px;
      border-radius: 12px;
      background: #f9fafb;
      border: 1px solid #eaecf0;
    }

    .dato small {
      display: block;
      color: var(--gris);
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .dato strong {
      font-size: 14px;
    }

    @media (min-width: 760px) {
      body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 380px;
        height: 100vh;
      }

      #mapa {
        height: 100vh;
      }

      .panel-info {
        margin-top: 0;
        border-radius: 0;
        overflow-y: auto;
        box-shadow: -5px 0 18px rgba(0, 0, 0, 0.10);
        padding-top: 34px;
      }
    }
  </style>

  <script>
    window.mapaListo = false;
    window.initMap = function () {
      window.mapaListo = true;
      window.dispatchEvent(new Event("google-maps-ready"));
    };
  </script>

  <script
    async
    defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAULZVgzMl8aubVLoqJyLs_ftyfb0E8D8o&language=es&region=MX&callback=initMap">
  </script>
</head>

<body>
  <div id="mapa"></div>

  <section class="panel-info">
    <div class="fila-estado">
      <span id="estadoTexto" class="etiqueta-estado">CARGANDO</span>
      <span id="ultimaActualizacion" class="ultima-actualizacion">Sin datos</span>
    </div>

    <h1 id="tituloPrincipal" class="titulo">Consultando tu pedido...</h1>
    <p id="subtituloDestino" class="subtitulo">Ferretería Granados</p>

    <div class="resumen">
      <div class="dato">
        <small>Pedido</small>
        <strong id="pedidoIdTexto">—</strong>
      </div>

      <div class="dato">
        <small>Distancia estimada</small>
        <strong id="distanciaTexto">—</strong>
      </div>
    </div>

    <div class="detalles">
      <img
        class="icono-camion"
        src="https://lh3.googleusercontent.com/d/1BO70O8A3Qf0qPeoFoCqezV3G0sNZMkc4"
        alt="Camioneta de reparto"
      />

      <div>
        <p id="nombreRepartidor" class="repartidor">Repartidor asignado</p>
        <p id="detalleRepartidor" class="detalle-secundario">Esperando ubicación</p>
      </div>
    </div>

    <div id="mensajeError" class="mensaje-error"></div>
  </section>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import {
      doc,
      getFirestore,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBNC-Oh6i2wyZMRiailIoYZ8rzpjN-6wBo",
      authDomain: "ferreteria-envios.firebaseapp.com",
      projectId: "ferreteria-envios",
      storageBucket: "ferreteria-envios.firebasestorage.app",
      messagingSenderId: "871957193583",
      appId: "1:871957193583:web:e093c54efa0919b142be9a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const ORIGEN = {
      lat: 20.922644,
      lng: -104.091522
    };

    const ICONO_CAMION =
      "https://lh3.googleusercontent.com/d/1BO70O8A3Qf0qPeoFoCqezV3G0sNZMkc4";

    let mapa;
    let marcadorOrigen;
    let marcadorDestino;
    let marcadorCamion;

    let cancelarPedido = null;
    let cancelarRepartidor = null;

    let pedidoActual = null;
    let posicionCamion = null;
    let primeraPosicion = true;

    const $ = (id) => document.getElementById(id);

    function obtenerPedidoId() {
      return new URLSearchParams(window.location.search).get("pedido")?.trim() || "";
    }

    function mostrarError(mensaje) {
      const elemento = $("mensajeError");
      elemento.style.display = "block";
      elemento.textContent = mensaje;
    }

    function ocultarError() {
      $("mensajeError").style.display = "none";
      $("mensajeError").textContent = "";
    }

    function formatearDistancia(metros) {
      const numero = Number(metros);

      if (!Number.isFinite(numero)) return "—";
      if (numero < 1000) return `${Math.round(numero)} m`;

      return `${(numero / 1000).toFixed(2)} km`;
    }

    function formatearFecha(timestamp) {
      if (!timestamp) return "Sin actualización";

      const fecha =
        typeof timestamp.toDate === "function"
          ? timestamp.toDate()
          : new Date(timestamp);

      if (Number.isNaN(fecha.getTime())) {
        return "Sin actualización";
      }

      return fecha.toLocaleString("es-MX", {
        hour: "2-digit",
        minute: "2-digit",
        day: "2-digit",
        month: "2-digit"
      });
    }

    function configurarEstado(estado) {
      const etiqueta = $("estadoTexto");
      const titulo = $("tituloPrincipal");

      const estados = {
        asignado: {
          texto: "ASIGNADO",
          color: "#1565c0",
          titulo: "Tu pedido fue asignado"
        },
        en_preparacion: {
          texto: "PREPARANDO",
          color: "#f9ab00",
          titulo: "Estamos preparando tu material"
        },
        en_camino: {
          texto: "EN CAMINO",
          color: "#d32f2f",
          titulo: "Tu material está en camino"
        },
        entregado: {
          texto: "ENTREGADO",
          color: "#2e7d32",
          titulo: "¡Tu material ha llegado!"
        },
        cancelado: {
          texto: "CANCELADO",
          color: "#667085",
          titulo: "El pedido fue cancelado"
        }
      };

      const config = estados[estado] || {
        texto: "PENDIENTE",
        color: "#667085",
        titulo: "Consultando el estado del pedido"
      };

      etiqueta.textContent = config.texto;
      etiqueta.style.background = config.color;
      titulo.textContent = config.titulo;
    }

    function animarMarcador(marker, nuevaPosicion, duracion = 2200) {
      const inicio = marker.getPosition();

      if (!inicio) {
        marker.setPosition(nuevaPosicion);
        return;
      }

      const latInicial = inicio.lat();
      const lngInicial = inicio.lng();
      const inicioTiempo = performance.now();

      function frame(tiempoActual) {
        const progreso = Math.min((tiempoActual - inicioTiempo) / duracion, 1);

        marker.setPosition({
          lat: latInicial + (nuevaPosicion.lat - latInicial) * progreso,
          lng: lngInicial + (nuevaPosicion.lng - lngInicial) * progreso
        });

        if (progreso < 1) {
          requestAnimationFrame(frame);
        }
      }

      requestAnimationFrame(frame);
    }

    function ajustarMapa() {
      if (!mapa || !pedidoActual) return;

      const puntos = [ORIGEN];

      const destino = obtenerDestino(pedidoActual);
      if (destino) puntos.push(destino);

      if (posicionCamion) puntos.push(posicionCamion);

      if (puntos.length === 1) {
        mapa.setCenter(ORIGEN);
        mapa.setZoom(16);
        return;
      }

      const bounds = new google.maps.LatLngBounds();
      puntos.forEach((punto) => bounds.extend(punto));

      mapa.fitBounds(bounds, {
        top: 80,
        right: 60,
        bottom: 80,
        left: 60
      });
    }

    function obtenerDestino(pedido) {
      const latitud = Number(
        pedido?.destino?.latitud ?? pedido?.latitud
      );

      const longitud = Number(
        pedido?.destino?.longitud ?? pedido?.longitud
      );

      if (!Number.isFinite(latitud) || !Number.isFinite(longitud)) {
        return null;
      }

      return {
        lat: latitud,
        lng: longitud
      };
    }

    function actualizarPedidoEnPantalla(pedidoId, pedido) {
      pedidoActual = pedido;

      $("pedidoIdTexto").textContent = pedidoId;
      $("subtituloDestino").textContent =
        pedido.direccionCorta ||
        pedido.direccion ||
        "Dirección de entrega";

      $("distanciaTexto").textContent =
        formatearDistancia(pedido.distanciaEstimadaMetros);

      $("nombreRepartidor").textContent =
        pedido.repartidorNombre || "Repartidor asignado";

      configurarEstado(pedido.estado);

      const destino = obtenerDestino(pedido);

      if (destino) {
        marcadorDestino.setPosition(destino);
        marcadorDestino.setVisible(true);
      } else {
        marcadorDestino.setVisible(false);
      }

      ajustarMapa();
    }

    function escucharRepartidor(uid) {
      if (cancelarRepartidor) {
        cancelarRepartidor();
        cancelarRepartidor = null;
      }

      if (!uid) {
        $("detalleRepartidor").textContent =
          "Aún no hay repartidor asignado";
        return;
      }

      cancelarRepartidor = onSnapshot(
        doc(db, "repartidores", uid),
        (snapshot) => {
          if (!snapshot.exists()) {
            mostrarError("No se encontró la información del repartidor.");
            return;
          }

          ocultarError();

          const repartidor = snapshot.data();

          $("nombreRepartidor").textContent =
            repartidor.nombre &&
            repartidor.nombre !== "Repartidor"
              ? repartidor.nombre
              : repartidor.correo || "Repartidor asignado";

          $("ultimaActualizacion").textContent =
            formatearFecha(
              repartidor.ultimaActualizacion ||
              repartidor.ultimaConexion
            );

          const velocidadKmh = Math.max(
            Number(repartidor.ubicacion?.velocidad || 0) * 3.6,
            0
          );

          $("detalleRepartidor").textContent =
            repartidor.estado === "entregando"
              ? `En reparto · ${Math.round(velocidadKmh)} km/h`
              : repartidor.estado || "Ubicación disponible";

          const latitud = Number(repartidor.ubicacion?.latitud);
          const longitud = Number(repartidor.ubicacion?.longitud);

          if (!Number.isFinite(latitud) || !Number.isFinite(longitud)) {
            return;
          }

          const nuevaPosicion = {
            lat: latitud,
            lng: longitud
          };

          posicionCamion = nuevaPosicion;
          animarMarcador(marcadorCamion, nuevaPosicion);

          if (primeraPosicion) {
            primeraPosicion = false;
            ajustarMapa();
          }
        },
        (error) => {
          console.error(error);
          mostrarError(
            "No fue posible consultar la ubicación del repartidor."
          );
        }
      );
    }

    function escucharPedido(pedidoId) {
      cancelarPedido = onSnapshot(
        doc(db, "rastreoPublico", pedidoId),
        (snapshot) => {
          if (!snapshot.exists()) {
            configurarEstado("no_existe");
            $("tituloPrincipal").textContent = "Pedido no encontrado";
            mostrarError(
              "Revisa que el enlace de seguimiento esté completo."
            );
            return;
          }

          ocultarError();

          const pedido = snapshot.data();
          actualizarPedidoEnPantalla(pedidoId, pedido);
          escucharRepartidor(pedido.repartidorUID);
        },
        (error) => {
          console.error(error);
          configurarEstado("error");
          mostrarError(
            "No fue posible consultar el pedido. Revisa los permisos de Firestore."
          );
        }
      );
    }
function escucharRastreoPublico(pedidoId) {
  if (cancelarPedido) {
    cancelarPedido();
    cancelarPedido = null;
  }

  cancelarPedido = onSnapshot(
    doc(db, "rastreoPublico", pedidoId),

    (snapshot) => {
      if (!snapshot.exists()) {
        configurarEstado("no_existe");

        document.getElementById(
          "tituloPrincipal"
        ).textContent = "Pedido no encontrado";

        mostrarError(
          "El pedido no existe o el enlace de seguimiento no es válido."
        );

        return;
      }

      ocultarError();

      const data = snapshot.data();

      pedidoActual = data;

      document.getElementById(
        "pedidoIdTexto"
      ).textContent = pedidoId;

      document.getElementById(
        "subtituloDestino"
      ).textContent =
        data.direccionCorta ||
        data.direccion ||
        "Dirección de entrega";

      document.getElementById(
        "distanciaTexto"
      ).textContent =
        formatearDistancia(
          data.distanciaEstimadaMetros
        );

      document.getElementById(
        "nombreRepartidor"
      ).textContent =
        data.repartidorNombre ||
        "Repartidor asignado";

      document.getElementById(
        "ultimaActualizacion"
      ).textContent =
        formatearFecha(
          data.ultimaActualizacion
        );

      configurarEstado(data.estado);

      const latitudDestino = Number(
        data.destino?.latitud
      );

      const longitudDestino = Number(
        data.destino?.longitud
      );

      if (
        Number.isFinite(latitudDestino) &&
        Number.isFinite(longitudDestino)
      ) {
        const destino = {
          lat: latitudDestino,
          lng: longitudDestino,
        };

        marcadorDestino.setPosition(destino);
        marcadorDestino.setVisible(true);
      }

      const latitudRepartidor = Number(
        data.ubicacionRepartidor?.latitud
      );

      const longitudRepartidor = Number(
        data.ubicacionRepartidor?.longitud
      );

      if (
        Number.isFinite(latitudRepartidor) &&
        Number.isFinite(longitudRepartidor)
      ) {
        const nuevaPosicion = {
          lat: latitudRepartidor,
          lng: longitudRepartidor,
        };

        posicionCamion = nuevaPosicion;

        animarMarcador(
          marcadorCamion,
          nuevaPosicion
        );

        const velocidadKmh = Math.max(
          Number(
            data.ubicacionRepartidor?.velocidad || 0
          ) * 3.6,
          0
        );

        document.getElementById(
          "detalleRepartidor"
        ).textContent =
          data.estado === "en_camino"
            ? `En reparto · ${Math.round(
                velocidadKmh
              )} km/h`
            : "Ubicación disponible";
      } else {
        document.getElementById(
          "detalleRepartidor"
        ).textContent =
          "Esperando ubicación";
      }

      ajustarMapa();
    },

    (error) => {
      console.error(
        "Error leyendo rastreo público:",
        error
      );

      mostrarError(
        "No fue posible consultar el seguimiento público."
      );
    }
  );
}
    function iniciarAplicacion() {
      mapa = new google.maps.Map($("mapa"), {
        center: ORIGEN,
        zoom: 16,
        disableDefaultUI: true,
        zoomControl: true,
        gestureHandling: "greedy"
      });

      marcadorOrigen = new google.maps.Marker({
        map: mapa,
        position: ORIGEN,
        title: "Ferretería Granados",
        label: {
          text: "F",
          color: "#ffffff",
          fontWeight: "800"
        }
      });

      marcadorDestino = new google.maps.Marker({
        map: mapa,
        visible: false,
        title: "Destino de entrega",
        icon: "https://maps.google.com/mapfiles/ms/icons/red-dot.png"
      });

      marcadorCamion = new google.maps.Marker({
        map: mapa,
        position: ORIGEN,
        title: "Repartidor",
        optimized: false,
        icon: {
          url: ICONO_CAMION,
          scaledSize: new google.maps.Size(84, 56),
          anchor: new google.maps.Point(42, 52)
        },
        zIndex: 20
      });

      const pedidoId = obtenerPedidoId();

      if (!pedidoId) {
        configurarEstado("no_existe");
        $("tituloPrincipal").textContent = "Falta el número de pedido";
        mostrarError(
          "Este enlace no contiene el parámetro ?pedido=ID_DEL_PEDIDO."
        );
        return;
      }

escucharRastreoPublico(pedidoId);    }

    if (window.mapaListo) {
      iniciarAplicacion();
    } else {
      window.addEventListener(
        "google-maps-ready",
        iniciarAplicacion,
        { once: true }
      );
    }

    window.addEventListener("beforeunload", () => {
      cancelarPedido?.();
      cancelarRepartidor?.();
    });
  </script>
</body>
</html>
