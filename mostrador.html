<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Despacho | Ferretería Granados</title>
    <style>
        :root { --naranja: #FF9800; --naranja-oscuro: #F57C00; --rojo: #d32f2f; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f4f4; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); width: 100%; max-width: 450px; border-top: 8px solid var(--naranja); }
        h1 { color: var(--naranja); text-transform: uppercase; text-align: center; font-size: 20px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 5px 0; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; color: white; }
        .btn-despacho { background: var(--naranja); }
        .btn-accion { background: #555; }
        .btn-eliminar { background: var(--rojo); }
        .section { margin-top: 20px; padding-top: 20px; border-top: 2px dashed #eee; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Ferretería Granados</h1>
        
        <select id="selectCliente" onchange="cargarCliente()">
            <option value="">-- Seleccionar Cliente --</option>
        </select>
        
        <input id="docId" type="hidden">
        <input id="cliente" placeholder="👤 Nombre del Cliente">
        
        <select id="selectCalle">
            <option value="">-- Seleccionar Calle --</option>
        </select>
        <input id="numExterior" placeholder="🏠 Número Exterior">
        
        <button class="btn-despacho" onclick="registrarEnvio()">🚀 Registrar y Enviar al Mapa</button>
        <button class="btn-accion" onclick="guardarCambios()">💾 Guardar Cambios</button>
        <button class="btn-eliminar" onclick="eliminarCliente()">🗑️ Eliminar Cliente</button>
        <button class="btn-eliminar" style="background:#ff9800" onclick="cancelarEnvio()">🚫 Cancelar Pedido</button>

        <div class="section">
            <h3 style="font-size: 14px; color: #666;">+ Agregar nuevo cliente</h3>
            <button class="btn-accion" style="background:#4CAF50" onclick="agregarNuevo()">Guardar como nuevo</button>
        </div>

        <div id="resultado" style="margin-top:20px;"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBNC-Oh6i2wyZMRiailIoYZ8rzpjN-6wBo", 
            authDomain: "ferreteria-envios.firebaseapp.com",
            projectId: "ferreteria-envios",
            storageBucket: "ferreteria-envios.firebasestorage.app",
            messagingSenderId: "871957193583",
            appId: "1:871957193583:web:e093c54efa0919b142be9a" 
        };
        const db = getFirestore(initializeApp(firebaseConfig));
        
        const calles = [
            "Calle 5 de Febrero", "Calle Allende", "Calle Colón", "Calle Degollado", 
            "Calle Donato Guerra", "Calle Javier Mina", "Calle Francisco Villa", 
            "Calle Hidalgo", "Calle Josefa Ortiz de Domínguez", "Calle López Mateos", 
            "Calle Melchor Ocampo", "Calle Morelos", "Calle Prisciliano Sánchez", 
            "Calle Vallarta", "Calle Zaragoza", "Privada Guadalupe Victoria", 
            "Privada Guerrero", "Privada Herrera y Cairo", "Privada Lerdo de Tejada", 
            "Privada López Cotilla", "Privada M. Miramontes", "Privada Manuel M. Diéguez", 
            "Privada Mariano Jiménez"
        ];

        // Llenar el select de calles
        const selCalle = document.getElementById('selectCalle');
        calles.forEach(c => {
            let opt = document.createElement('option');
            opt.value = c; opt.innerHTML = c;
            selCalle.appendChild(opt);
        });

        let listaClientes = [];

        async function cargarLista() {
            const querySnapshot = await getDocs(collection(db, "clientes"));
            const select = document.getElementById('selectCliente');
            select.innerHTML = '<option value="">-- Seleccionar Cliente --</option>';
            listaClientes = [];
            
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                listaClientes.push({ id: doc.id, ...data });
                let opt = document.createElement('option');
                opt.value = listaClientes.length - 1;
                opt.innerHTML = data.nombre;
                select.appendChild(opt);
            });
        }

        window.cargarCliente = () => {
            const idx = document.getElementById('selectCliente').value;
            if(idx !== "") {
                const c = listaClientes[idx];
                document.getElementById('docId').value = c.id;
                document.getElementById('cliente').value = c.nombre;
                
                // Intento separar calle y número
                const match = c.direccion.match(/(.*)\s+(\d+)$/);
                if (match) {
                    document.getElementById('selectCalle').value = match[1];
                    document.getElementById('numExterior').value = match[2];
                } else {
                    document.getElementById('selectCalle').value = "";
                    document.getElementById('numExterior').value = c.direccion;
                }
            }
        };

        window.guardarCambios = async () => {
            const id = document.getElementById('docId').value;
            const calle = document.getElementById('selectCalle').value;
            const num = document.getElementById('numExterior').value;
            if(!id) return alert("Selecciona un cliente primero");
            
            await updateDoc(doc(db, "clientes", id), {
                nombre: document.getElementById('cliente').value,
                direccion: `${calle} ${num}`
            });
            alert("¡Cliente actualizado!");
            cargarLista();
        };

        window.eliminarCliente = async () => {
            const id = document.getElementById('docId').value;
            if(!id) return;
            await deleteDoc(doc(db, "clientes", id));
            alert("¡Cliente eliminado!");
            cargarLista();
        };

        window.agregarNuevo = async () => {
            const calle = document.getElementById('selectCalle').value;
            const num = document.getElementById('numExterior').value;
            await addDoc(collection(db, "clientes"), {
                nombre: document.getElementById('cliente').value,
                direccion: `${calle} ${num}`
            });
            cargarLista();
        };

       window.registrarEnvio = async () => {
    const cliente = document.getElementById('cliente').value;
    const calle = document.getElementById('selectCalle').value;
    const num = document.getElementById('numExterior').value;
    
    if(!calle) return alert("Selecciona una calle");
    
    // AQUÍ ESTÁ EL TRUCO: Agregamos el contexto de "San Andrés, Magdalena, Jalisco, México"
    const direccionCompleta = `${calle} ${num}, San Andrés, Magdalena, Jalisco, México`;

    await setDoc(doc(db, "envios", "entrega1"), { 
        cliente, 
        destino: direccionCompleta, // Guardamos la dirección completa
        estado: "en_preparacion",
        latitud: 0, 
        longitud: 0,
        ultimaActualizacion: new Date()
    }, { merge: true });
            const msg = `Hola ${cliente}! Tu pedido de Ferretería Granados va en camino a: ${direccionCompleta}. Síguelo aquí: https://arceo86.github.io/envio-granados/`;
            
            document.getElementById('resultado').innerHTML = `
                <a href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" 
                   style="display:block; padding:15px; background:#25D366; color:white; text-decoration:none; border-radius:8px; text-align:center;">
                    Enviar por WhatsApp 📲
                </a>
            `;
        };

        window.cancelarEnvio = async () => {
            if(!confirm("¿Cancelar pedido?")) return;
            await setDoc(doc(db, "envios", "entrega1"), { estado: "cancelado", destino: "", cliente: "", ultimaActualizacion: new Date() }, { merge: true });
            alert("Cancelado.");
        };

        cargarLista();
    </script>
</body>
</html>
