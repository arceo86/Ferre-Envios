<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Despacho | Ferretería Granados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .action-card { transition: all 0.3s ease; }
        .action-card:hover { transform: translateY(-2px); }
        .btn-hover:hover { filter: brightness(1.1); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8 border border-slate-100">
        
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">FERRETERIA GRANADOS</h1>
            <p class="text-slate-500 font-medium mt-1">Panel de Control de Despacho</p>
        </header>

        <div class="space-y-6">
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">ID Cliente</label>
                <input type="text" id="docId" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-100 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all" placeholder="Ej: CL-001">
            </div>

            <div class="space-y-4">
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Nombre del Cliente</label>
                    <input type="text" id="cliente" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-100 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all">
                </div>
                <div class="space-y-2">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Destino</label>
                    <input type="text" id="destino" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-100 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mt-8">
                <button class="col-span-2 btn-hover bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-100 flex items-center justify-center gap-2" onclick="registrarEnvio()">
                    <span>🚀</span> Registrar y Enviar
                </button>
                <button class="btn-hover bg-emerald-600 text-white font-semibold py-3 rounded-xl shadow-lg shadow-emerald-50" onclick="guardarCambios()">💾 Guardar</button>
                <button class="btn-hover bg-amber-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-amber-50" onclick="cancelarEnvio()">🚫 Cancelar</button>
                <button class="col-span-2 btn-hover bg-rose-600 text-white font-semibold py-3 rounded-xl shadow-lg shadow-rose-50" onclick="eliminarCliente()">🗑️ Eliminar Cliente</button>
            </div>

            <div id="resultado" class="text-center text-sm font-semibold p-4 rounded-xl hidden"></div>
        </div>

        <div class="mt-10 border-t border-slate-100 pt-6">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Historial del Día</h3>
            <div id="historial-lista" class="space-y-3 max-h-60 overflow-y-auto custom-scrollbar pr-2">
                <!-- Aquí se cargarán los pedidos dinámicamente -->
                <p class="text-slate-400 text-sm text-center italic">Cargando historial...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, setDoc, deleteDoc, collection, query, orderBy, onSnapshot, limit } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "tu-proyecto.firebaseapp.com",
            projectId: "tu-proyecto-id",
            storageBucket: "tu-proyecto.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- Historial Realtime ---
        const historialLista = document.getElementById('historial-lista');
        const q = query(collection(db, "envios"), orderBy("ultimaActualizacion", "desc"), limit(10));
        
        onSnapshot(q, (snapshot) => {
            historialLista.innerHTML = '';
            snapshot.forEach((doc) => {
                const data = doc.data();
                const color = data.estado === 'entregado' ? 'bg-green-100 text-green-700' : 
                              data.estado === 'en_camino' ? 'bg-blue-100 text-blue-700' : 
                              data.estado === 'cancelado' ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700';

                const div = document.createElement('div');
                div.className = "p-3 rounded-xl bg-slate-50 border border-slate-100 flex justify-between items-center";
                div.innerHTML = `
                    <div>
                        <p class="font-bold text-sm text-slate-800">${data.cliente || 'Sin nombre'}</p>
                        <p class="text-xs text-slate-500 truncate w-32">${data.destino || 'Sin destino'}</p>
                    </div>
                    <span class="text-[10px] font-bold px-2 py-1 rounded-full ${color} uppercase">${data.estado}</span>
                `;
                historialLista.appendChild(div);
            });
        });

        // --- Funciones de Accion ---
        const resBox = document.getElementById('resultado');
        
        window.limpiarFormulario = () => {
            document.getElementById('cliente').value = '';
            document.getElementById('destino').value = '';
            document.getElementById('docId').value = '';
        };

        const showResult = (msg, isError = false) => {
            resBox.innerText = msg;
            resBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
            resBox.classList.add(isError ? 'bg-red-100' : 'bg-green-100', isError ? 'text-red-700' : 'text-green-700');
        };

        window.registrarEnvio = async () => {
            const cliente = document.getElementById('cliente').value;
            const destino = document.getElementById('destino').value;
            if(!cliente || !destino) return showResult("⚠️ Llena los campos.", true);
            await setDoc(doc(db, "envios", "entrega_" + Date.now()), { cliente, destino, estado: "en_preparacion", ultimaActualizacion: new Date() });
            limpiarFormulario();
            showResult("✅ Pedido registrado.");
        };

        window.cancelarEnvio = async () => {
            const id = document.getElementById('docId').value || "entrega1";
            await setDoc(doc(db, "envios", id), { estado: "cancelado", ultimaActualizacion: new Date() }, { merge: true });
            limpiarFormulario();
            showResult("🚫 Pedido cancelado.");
        };

        window.eliminarCliente = async () => {
            const id = document.getElementById('docId').value;
            if(!id) return showResult("⚠️ Ingresa ID para eliminar.", true);
            try {
                await deleteDoc(doc(db, "clientes", id));
                limpiarFormulario();
                showResult("🗑️ Cliente eliminado.");
            } catch (e) { showResult("❌ Error.", true); }
        };

        window.guardarCambios = () => showResult("💾 Cambios guardados.");
    </script>
</body>
</html>
